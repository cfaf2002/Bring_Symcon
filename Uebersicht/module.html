<style>
    .ueb {
        --eink-akzent: #e5574f;
        --eink-text: #f2f2f2;
        --eink-leise: rgba(255, 255, 255, 0.62);
        --eink-flaeche: rgba(255, 255, 255, 0.08);
        --eink-flaeche-hover: rgba(255, 255, 255, 0.13);
        --eink-rand: rgba(255, 255, 255, 0.18);
        color: var(--eink-text);
        padding: 44px 4px 6px;
        height: 100%;
        overflow-y: auto;
        font-size: 15px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .ueb.hell {
        --eink-text: #1d1d1f;
        --eink-leise: rgba(0, 0, 0, 0.55);
        --eink-flaeche: rgba(0, 0, 0, 0.05);
        --eink-flaeche-hover: rgba(0, 0, 0, 0.09);
        --eink-rand: rgba(0, 0, 0, 0.15);
    }
    .ueb-raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
    .karte { background: var(--eink-flaeche); border: 1px solid transparent; border-radius: 14px; padding: 14px; cursor: pointer; display: flex; flex-direction: column; gap: 12px; min-height: 120px; transition: background 0.15s, transform 0.1s; user-select: none; }
    .karte:hover { background: var(--eink-flaeche-hover); border-color: var(--eink-rand); }
    .karte:active { transform: scale(0.98); }
    .karte-kopf { display: flex; align-items: center; gap: 10px; }
    .karte-name { flex: 1; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .karte-zahl { min-width: 28px; height: 24px; border-radius: 12px; background: var(--eink-akzent); color: #fff; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 8px; }
    .karte-zahl.null { background: var(--eink-flaeche-hover); color: var(--eink-leise); }
    .karte-pfeil { font-size: 22px; color: var(--eink-leise); line-height: 1; }
    .karte-artikel { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 62px; }
    .chip .symbol { width: 44px; height: 44px; border-radius: 10px; background: var(--eink-akzent); color: #fff; display: flex; align-items: center; justify-content: center; }
    .chip .symbol img { width: 30px; height: 30px; object-fit: contain; filter: brightness(0) invert(1); }
    .chip .symbol .zeichen { width: 30px; height: 30px; font-size: 15px; border-width: 1.5px; }
    .chip .chip-name { font-size: 11px; line-height: 1.15; text-align: center; max-width: 62px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chip.mehr-chip .symbol { background: var(--eink-flaeche-hover); color: var(--eink-text); font-size: 14px; font-weight: 700; }
    .karte-leer { color: var(--eink-leise); font-size: 14px; }
    .ueb-leer { padding: 24px 8px; text-align: center; color: var(--eink-leise); border: 1px dashed var(--eink-rand); border-radius: 12px; }
    .ueb-meldung { font-size: 12px; color: var(--eink-leise); min-height: 14px; }

    .zurueck-leiste { display: flex; align-items: center; gap: 10px; margin-bottom: -2px; }
    .zurueck-leiste .knopf { display: flex; align-items: center; gap: 6px; padding: 0 14px 0 10px; }
    .zurueck-leiste .pfeil { font-size: 20px; line-height: 1; margin-top: -2px; }
    .zurueck-titel { flex: 1; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>

<div class="ueb" id="ueb" lang="de">
    <div class="ueb-raster" id="ueb-raster"></div>
    <div class="ueb-leer" id="ueb-leer" style="display:none">Noch keine Bring!-Listen angelegt. Listen über den Bring Konfigurator erstellen.</div>
    <div class="ueb-meldung" id="ueb-meldung"></div>
</div>

<script>
    var uebersicht = { listen: [], katalog: [] };
    var aktuell = null;

    (function () {
        var liste = document.querySelector('.eink');
        var ueb = document.getElementById('ueb');
        if (liste.classList.contains('hell')) ueb.classList.add('hell');

        // Zurück-Leiste in die Listenansicht einsetzen
        var leiste = document.createElement('div');
        leiste.className = 'zurueck-leiste';
        leiste.innerHTML = '<button class="knopf" type="button" onclick="zurueck()"><span class="pfeil">‹</span>Zurück</button>' +
            '<div class="zurueck-titel" id="zurueck-titel"></div>';
        liste.insertBefore(leiste, liste.firstChild);
        liste.style.display = 'none';
    })();

    // Aktionen der Listenansicht an die gewählte Liste weiterleiten
    function senden(aktion) {
        aktion.liste = aktuell;
        requestAction('Aktion', JSON.stringify(aktion));
    }

    function handleMessage(data) {
        var d;
        try {
            d = (typeof data === 'string') ? JSON.parse(data) : data;
        } catch (e) {
            return;
        }
        if (d.meldung) {
            if (aktuell !== null) meldung(d.meldung); else uebMeldung(d.meldung);
            return;
        }
        if (d.katalog) uebersicht.katalog = d.katalog;
        if (d.listen) uebersicht.listen = d.listen;
        anzeigen();
    }

    function uebMeldung(text) {
        var m = document.getElementById('ueb-meldung');
        m.textContent = text;
        clearTimeout(uebMeldung.t);
        uebMeldung.t = setTimeout(function () { m.textContent = ''; }, 6000);
    }

    function finden(id) {
        for (var i = 0; i < uebersicht.listen.length; i++) {
            if (uebersicht.listen[i].id === id) return uebersicht.listen[i];
        }
        return null;
    }

    function oeffnenListe(id) {
        aktuell = id;
        document.getElementById('neu').value = '';
        anzeigen();
        document.querySelector('.eink').scrollTop = 0;
    }

    function zurueck() {
        aktuell = null;
        if (typeof schliessenVorschlaege === 'function') schliessenVorschlaege();
        if (typeof schliessen === 'function') schliessen();
        anzeigen();
    }

    function anzeigen() {
        var liste = document.querySelector('.eink');
        var ueb = document.getElementById('ueb');
        var l = aktuell !== null ? finden(aktuell) : null;
        if (aktuell !== null && !l) aktuell = null;

        if (l) {
            eink = {
                titel: l.name,
                bilder: l.bilder,
                purchase: l.purchase || [],
                recently: l.recently || [],
                katalog: uebersicht.katalog
            };
            document.getElementById('zurueck-titel').textContent = l.name;
            ueb.style.display = 'none';
            liste.style.display = 'flex';
            zeichnen();
            return;
        }

        liste.style.display = 'none';
        ueb.style.display = 'flex';
        zeichnenUebersicht();
    }

    function zeichnenUebersicht() {
        var raster = document.getElementById('ueb-raster');
        raster.innerHTML = '';
        document.getElementById('ueb-leer').style.display = uebersicht.listen.length ? 'none' : 'block';

        uebersicht.listen.forEach(function (l) {
            eink.bilder = l.bilder;
            var karte = document.createElement('div');
            karte.className = 'karte';
            karte.onclick = function () { oeffnenListe(l.id); };

            var kopf = document.createElement('div');
            kopf.className = 'karte-kopf';
            var name = document.createElement('div');
            name.className = 'karte-name';
            name.textContent = l.name;
            var zahl = document.createElement('div');
            var anzahl = (l.purchase || []).length;
            zahl.className = 'karte-zahl' + (anzahl ? '' : ' null');
            zahl.textContent = anzahl;
            var pfeil = document.createElement('div');
            pfeil.className = 'karte-pfeil';
            pfeil.textContent = '›';
            kopf.appendChild(name);
            kopf.appendChild(zahl);
            kopf.appendChild(pfeil);
            karte.appendChild(kopf);

            var artikel = l.purchase || [];
            if (!artikel.length) {
                var leer = document.createElement('div');
                leer.className = 'karte-leer';
                leer.textContent = 'Alles erledigt – nichts zu kaufen.';
                karte.appendChild(leer);
            } else {
                var reihe = document.createElement('div');
                reihe.className = 'karte-artikel';
                var max = artikel.length > 8 ? 7 : 8;
                artikel.slice(0, max).forEach(function (a) {
                    var chip = document.createElement('div');
                    chip.className = 'chip';
                    var sym = document.createElement('div');
                    sym.className = 'symbol';
                    sym.appendChild(symbol(a.icon, a.buchstabe, a.name));
                    var n = document.createElement('div');
                    n.className = 'chip-name';
                    n.textContent = a.name;
                    n.title = a.name + (a.spec ? ' – ' + a.spec : '');
                    chip.appendChild(sym);
                    chip.appendChild(n);
                    reihe.appendChild(chip);
                });
                if (artikel.length > max) {
                    var mehr = document.createElement('div');
                    mehr.className = 'chip mehr-chip';
                    mehr.innerHTML = '<div class="symbol">+' + (artikel.length - max) + '</div><div class="chip-name">weitere</div>';
                    reihe.appendChild(mehr);
                }
                karte.appendChild(reihe);
            }
            raster.appendChild(karte);
        });
    }
</script>
