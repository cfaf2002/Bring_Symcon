    Eine Bring!-Liste: Suche mit Vorschlägen, Artikel als Kacheln, zuletzt verwendet, Benachrichtigungen. Texte nur per textContent.

<style>
    /* ===== Hausstil cfaf2002 · Kachel-Grundlage v1 (siehe STYLEGUIDE.md) =====
       Farbschema 0 = Symcon-Design (Farben der Visualisierung), 1 = Dunkel, 2 = Hell.
       Modulspezifisch ist nur --brand (Akzent der festen Farbschemas). */
    :root {
        --brand: #e5574f;
        --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --fg: var(--content-color, #eef3f7);
        --accent: var(--accent-color, var(--brand));
        --on-accent: #ffffff;
        --muted: color-mix(in srgb, var(--fg) 65%, transparent);
        --faint: color-mix(in srgb, var(--fg) 40%, transparent);
        --line: color-mix(in srgb, var(--fg) 15%, transparent);
        --surface: color-mix(in srgb, var(--fg) 7%, transparent);
        --surface-hover: color-mix(in srgb, var(--fg) 12%, transparent);
        --popup: var(--card-color, #232a33);
        --ok: #34b36b;
        --warn: #e2a63b;
        --bad: #e5484d;
        --info: #4b8ef0;
        --off: #8796a5;
        --radius-l: 14px;
        --radius: 12px;
        --radius-s: 8px;
        --pill: 999px;
        --gap: 8px;
    }
    html.theme-dark  { --fg: #eef3f7; --accent: var(--brand); --tile-bg: #1b2530; --popup: #232d39; }
    html.theme-light { --fg: #1d2b36; --accent: var(--brand); --tile-bg: #e9eef3; --popup: #ffffff; }
    html.theme-dark body, html.theme-light body { background: var(--tile-bg); }
    html, body { font-family: var(--font); color: var(--fg); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
    /* ===== Ende Kachel-Grundlage ===== */

    /* Modul-Variablen aus der Kachel-Grundlage */
    .eink {
        --eink-akzent: var(--accent);
        --eink-akzent-text: var(--on-accent);
        --eink-text: var(--fg);
        --eink-leise: var(--muted);
        --eink-flaeche: var(--surface);
        --eink-flaeche-hover: var(--surface-hover);
        --eink-rand: var(--line);
        --eink-menue: var(--popup);
        color: var(--eink-text);
    }
    .eink.hell .artikel.zuletzt img { filter: invert(1); opacity: 0.75; }
    .suche { position: relative; flex: 1; min-width: 0; display: flex; }
    .suche input { width: 100%; }
    .vorschlaege { position: absolute; left: 0; right: 0; top: 42px; z-index: 20; background: var(--eink-menue); border: 1px solid var(--eink-rand); border-radius: var(--radius); box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35); padding: 4px; max-height: 330px; overflow-y: auto; display: none; }
    .vorschlaege.offen { display: block; }
    .vorschlag { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: var(--radius-s); cursor: pointer; }
    .vorschlag:hover, .vorschlag.aktiv { background: var(--eink-flaeche-hover); }
    .vorschlag .symbol { width: 34px; height: 34px; flex: none; border-radius: var(--radius-s); background: var(--eink-akzent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; }
    .vorschlag .symbol img { width: 26px; height: 26px; object-fit: contain; filter: brightness(0) invert(1); }
    .vorschlag .symbol .zeichen { width: 26px; height: 26px; font-size: 14px; border-width: 1.5px; }
    .vorschlag .text { flex: 1; min-width: 0; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vorschlag .text b { color: var(--eink-akzent); }
    .vorschlag .hinweis { font-size: 12px; color: var(--eink-leise); white-space: nowrap; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: transparent; color: inherit; }
    body, button, input { font-family: var(--font); }
    .eink { display: flex; flex-direction: column; gap: 12px; padding: 44px 4px 6px; height: 100%; overflow-y: auto; font-size: 15px; }
    .knopf { border: 1px solid var(--eink-rand); background: var(--eink-flaeche); color: inherit; border-radius: var(--radius-s); padding: 0 12px; height: 38px; font-size: 14px; cursor: pointer; white-space: nowrap; }
    .knopf:hover { background: var(--eink-flaeche-hover); }
    .knopf:active { transform: scale(0.97); }
    .knopf.haupt { background: var(--eink-akzent); color: var(--eink-akzent-text); border-color: transparent; font-size: 22px; width: 42px; padding: 0; }
    .knopf.rund { width: 38px; padding: 0; font-size: 18px; }
    .eingabe { display: flex; gap: 8px; }
    .eingabe input { flex: 1; min-width: 0; height: 38px; padding: 0 12px; border-radius: var(--radius-s); border: 1px solid var(--eink-rand); background: var(--eink-flaeche); color: inherit; font-size: 15px; outline: none; }
    .eingabe input:focus { border-color: var(--eink-akzent); }
    .eingabe input::placeholder { color: var(--eink-leise); }
    .abschnitt { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--eink-leise); }
    .abschnitt .zahl { background: var(--eink-akzent); color: var(--eink-akzent-text); border-radius: var(--pill); padding: 1px 8px; font-size: 12px; letter-spacing: 0; }
    .raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
    .artikel { position: relative; height: 96px; border-radius: var(--radius); padding: 8px 6px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; cursor: pointer; user-select: none; -webkit-user-select: none; overflow: hidden; transition: transform 0.1s, background 0.15s; }
    .artikel.kaufen { background: var(--eink-akzent); color: var(--eink-akzent-text); }
    .artikel.zuletzt { background: var(--eink-flaeche); }
    .artikel.zuletzt:hover { background: var(--eink-flaeche-hover); }
    .artikel:active { transform: scale(0.95); }
    .artikel img, .zeichen { width: 38px; height: 38px; flex: none; }
    .artikel img { object-fit: contain; }
    .artikel.kaufen img { filter: brightness(0) invert(1); }
    .artikel.zuletzt img { opacity: 0.8; }
    .zeichen { border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; border: 2px solid currentColor; }
    .name { font-size: 13px; font-weight: 600; line-height: 1.15; max-height: 2.3em; overflow: hidden; overflow-wrap: break-word; hyphens: auto; -webkit-hyphens: auto; }
    .spec { font-size: 12px; opacity: 0.85; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; margin-top: -2px; }
    .mehr { position: absolute; top: 0; right: 0; width: 36px; height: 36px; display: flex; align-items: flex-start; justify-content: flex-end; border: none; background: none; color: inherit; font-size: 16px; line-height: 1; cursor: pointer; padding: 4px 6px 0 0; opacity: 0.45; }
    .mehr:hover { opacity: 1; }
    .leer { padding: 20px 8px; text-align: center; color: var(--eink-leise); border: 1px dashed var(--eink-rand); border-radius: var(--radius); }
    .meldung { font-size: 12px; color: var(--eink-leise); min-height: 14px; margin-top: -6px; }
    .fuss { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: auto; }
    .dialog { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); display: none; align-items: center; justify-content: center; padding: 16px; }
    .dialog.offen { display: flex; }
    .dialog-box { background: var(--popup); color: var(--fg); border-radius: var(--radius-l); padding: 16px; width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); }
    .dialog-box h3 { margin: 0; font-size: 16px; }
    .dialog-box input { height: 36px; padding: 0 12px; border-radius: var(--radius-s); border: 1px solid var(--line); background: var(--surface); color: inherit; font-size: 14px; }
    .dialog-box .knopf { border-color: var(--line); background: var(--surface); }
    .dialog-box .knopf.haupt { background: var(--accent); width: auto; padding: 0 14px; font-size: 13px; }
    .dialog-knoepfe { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
</style>

<div class="eink" lang="de">
    <form class="eingabe" onsubmit="hinzufuegen(event)">
        <div class="suche">
            <input id="neu" type="text" placeholder="Artikel suchen oder hinzufügen (Artikel, Beschreibung)" autocomplete="off"
                oninput="suchen()" onkeydown="tasten(event)" onfocus="suchen()" onblur="setTimeout(schliessenVorschlaege, 200)">
            <div class="vorschlaege" id="vorschlaege"></div>
        </div>
        <button class="knopf haupt" type="submit" title="Hinzufügen">+</button>
        <button class="knopf rund" type="button" title="Aktualisieren" onclick="senden({aktion:'aktualisieren'})">⟳</button>
    </form>

    <div class="abschnitt">Einkaufen <span class="zahl" id="anzahl">0</span></div>
    <div id="kaufen" class="raster"></div>
    <div id="leer" class="leer" style="display:none">Alles erledigt – die Liste ist leer.</div>

    <div id="zuletztKopf" class="abschnitt" style="display:none">Zuletzt verwendet</div>
    <div id="zuletzt" class="raster"></div>

    <div class="meldung" id="meldung"></div>

    <div class="fuss">
        <button class="knopf" onclick="benachrichtigen('GOING_SHOPPING', 'Gehe einkaufen')">Gehe einkaufen</button>
        <button class="knopf" onclick="benachrichtigen('SHOPPING_DONE', 'Einkauf erledigt')">Einkauf erledigt</button>
        <button class="knopf" onclick="benachrichtigen('CHANGED_LIST', 'Liste geändert')">Liste geändert</button>
    </div>
</div>

<div class="dialog" id="dialog" onclick="if (event.target === this) schliessen()">
    <div class="dialog-box">
        <h3 id="dialogTitel">Artikel</h3>
        <input id="dialogSpec" type="text" placeholder="Beschreibung (z. B. 2 Liter)">
        <div class="dialog-knoepfe">
            <button class="knopf" onclick="entfernen()">Entfernen</button>
            <button class="knopf" onclick="schliessen()">Abbrechen</button>
            <button class="knopf haupt" onclick="speichern()">Speichern</button>
        </div>
    </div>
</div>

<script>
    // Hausstil: Farbschema der Kachel (0 = Symcon-Design, 1 = Dunkel, 2 = Hell)
    function applyTheme(theme) {
        var root = document.documentElement;
        root.classList.toggle('theme-dark', theme === 1);
        root.classList.toggle('theme-light', theme === 2);
    }

    var eink = { titel: '', bilder: '', purchase: [], recently: [] };

    // Hell/Dunkel anhand des Hintergrunds der Symcon-Kachel erkennen
    (function () {
        function hell(farbe) {
            var m = (farbe || '').match(/rgba?\(([\d.]+),\s*([\d.]+),\s*([\d.]+)(?:,\s*([\d.]+))?/);
            if (!m || (m[4] !== undefined && parseFloat(m[4]) < 0.3)) return null;
            return (0.299 * m[1] + 0.587 * m[2] + 0.114 * m[3]) > 150;
        }
        var ergebnis = null;
        try {
            var el = window.frameElement;
            while (el && ergebnis === null) {
                ergebnis = hell(window.parent.getComputedStyle(el).backgroundColor);
                el = el.parentElement;
            }
        } catch (e) { }
        if (ergebnis === null) ergebnis = hell(getComputedStyle(document.body).backgroundColor);
        if (ergebnis) document.querySelector('.eink').classList.add('hell');
    })();
    var einkAktuell = null;

    function handleMessage(data) {
        var d;
        try {
            d = (typeof data === 'string') ? JSON.parse(data) : data;
        } catch (e) {
            return;
        }
        if (d.meldung) {
            meldung(d.meldung);
            return;
        }
        if (typeof d.theme === 'number') {
            applyTheme(d.theme);
            if (d.theme === 1) document.querySelector('.eink').classList.remove('hell');
            if (d.theme === 2) document.querySelector('.eink').classList.add('hell');
            delete d.theme;
        }
        for (var k in d) eink[k] = d[k];
        zeichnen();
    }

    function senden(aktion) {
        requestAction('Kachel', JSON.stringify(aktion));
    }

    function meldung(text) {
        var m = document.getElementById('meldung');
        m.textContent = text;
        clearTimeout(meldung.t);
        meldung.t = setTimeout(function () { m.textContent = ''; }, 6000);
    }

    function symbol(icon, buchstabe, name) {
        var img = document.createElement('img');
        img.alt = '';
        img.loading = 'lazy';
        img.src = eink.bilder + icon + '.png';
        img.onerror = function () {
            if (!img.dataset.ersatz && buchstabe) {
                img.dataset.ersatz = '1';
                img.src = eink.bilder + buchstabe + '.png';
            } else {
                var z = document.createElement('div');
                z.className = 'zeichen';
                z.textContent = (name || '?').charAt(0).toUpperCase();
                img.replaceWith(z);
            }
        };
        return img;
    }

    function kachel(artikel, bereich) {
        var el = document.createElement('div');
        el.className = 'artikel ' + (bereich === 'purchase' ? 'kaufen' : 'zuletzt');
        el.title = bereich === 'purchase' ? 'Antippen zum Abhaken' : 'Antippen zum Hinzufügen';

        el.appendChild(symbol(artikel.icon, artikel.buchstabe, artikel.name));

        var n = document.createElement('div');
        n.className = 'name';
        n.textContent = artikel.name;
        el.appendChild(n);

        if (artikel.spec) {
            var s = document.createElement('div');
            s.className = 'spec';
            s.textContent = artikel.spec;
            el.appendChild(s);
        }

        var mehr = document.createElement('button');
        mehr.className = 'mehr';
        mehr.textContent = '⋮';
        mehr.title = 'Bearbeiten';
        mehr.onclick = function (e) {
            e.stopPropagation();
            oeffnen(artikel, bereich);
        };
        el.appendChild(mehr);
        el.oncontextmenu = function (e) {
            e.preventDefault();
            oeffnen(artikel, bereich);
        };

        el.onclick = function () {
            if (bereich === 'purchase') {
                verschieben(artikel.key, 'purchase', 'recently');
                senden({ aktion: 'abhaken', key: artikel.key });
            } else {
                verschieben(artikel.key, 'recently', 'purchase');
                senden({ aktion: 'wieder', key: artikel.key });
            }
        };
        return el;
    }

    // Sofortige Rückmeldung, bevor die Cloud antwortet
    function verschieben(key, von, nach) {
        var i = eink[von].findIndex(function (a) { return a.key === key; });
        if (i < 0) return;
        var a = eink[von].splice(i, 1)[0];
        if (nach === 'recently') eink.recently.unshift(a); else eink.purchase.push(a);
        zeichnen();
    }

    function zeichnen() {
        document.getElementById('anzahl').textContent = eink.purchase.length;

        var kaufen = document.getElementById('kaufen');
        kaufen.innerHTML = '';
        eink.purchase.forEach(function (a) { kaufen.appendChild(kachel(a, 'purchase')); });
        document.getElementById('leer').style.display = eink.purchase.length ? 'none' : 'block';

        var zuletzt = document.getElementById('zuletzt');
        zuletzt.innerHTML = '';
        eink.recently.forEach(function (a) { zuletzt.appendChild(kachel(a, 'recently')); });
        document.getElementById('zuletztKopf').style.display = eink.recently.length ? 'block' : 'none';

    }

    // ---------- Vorschläge beim Tippen ----------
    var treffer = [];
    var auswahl = -1;

    function eingabeTeile() {
        var text = document.getElementById('neu').value;
        var i = text.indexOf(',');
        return {
            name: (i < 0 ? text : text.substring(0, i)).trim(),
            spec: i < 0 ? '' : text.substring(i + 1).trim()
        };
    }

    function aufListe(key) {
        return eink.purchase.some(function (a) { return a.key === key; });
    }

    function zuletzt(key) {
        return eink.recently.some(function (a) { return a.key === key; });
    }

    function suchen() {
        var q = eingabeTeile().name.toLowerCase();
        treffer = [];
        auswahl = -1;
        if (!q) {
            schliessenVorschlaege();
            return;
        }
        var genau = false;
        (eink.katalog || []).forEach(function (e) {
            var name = e[1].toLowerCase();
            var key = e[0].toLowerCase();
            var rang = -1;
            if (name.indexOf(q) === 0 || key.indexOf(q) === 0) rang = 0;
            else if ((' ' + name).indexOf(' ' + q) >= 0 || name.indexOf('-' + q) >= 0) rang = 1;
            else if (name.indexOf(q) > 0 || key.indexOf(q) > 0) rang = 2;
            if (rang < 0) return;
            if (name === q) genau = true;
            if (zuletzt(e[0]) && rang > 0) rang -= 0.5;
            treffer.push({ key: e[0], name: e[1], icon: e[2], buchstabe: e[3], rang: rang });
        });
        treffer.sort(function (a, b) { return a.rang - b.rang || a.name.length - b.name.length || a.name.localeCompare(b.name); });
        treffer = treffer.slice(0, 8);
        if (!genau) {
            var roh = eingabeTeile().name;
            treffer.push({ key: '', name: roh, frei: true });
        }
        if (treffer.length) auswahl = 0;
        zeichnenVorschlaege(q);
    }

    function hervorheben(text, q) {
        var i = text.toLowerCase().indexOf(q);
        var span = document.createElement('span');
        if (i < 0 || !q) {
            span.textContent = text;
            return span;
        }
        span.appendChild(document.createTextNode(text.substring(0, i)));
        var b = document.createElement('b');
        b.textContent = text.substring(i, i + q.length);
        span.appendChild(b);
        span.appendChild(document.createTextNode(text.substring(i + q.length)));
        return span;
    }

    function zeichnenVorschlaege(q) {
        var box = document.getElementById('vorschlaege');
        box.innerHTML = '';
        treffer.forEach(function (t, i) {
            var zeile = document.createElement('div');
            zeile.className = 'vorschlag' + (i === auswahl ? ' aktiv' : '');
            var sym = document.createElement('div');
            sym.className = 'symbol';
            if (t.frei) {
                sym.textContent = '+';
                sym.style.fontSize = '20px';
            } else {
                sym.appendChild(symbol(t.icon, t.buchstabe, t.name));
            }
            zeile.appendChild(sym);
            var text = document.createElement('div');
            text.className = 'text';
            if (t.frei) {
                text.textContent = '„' + t.name + '“ als eigenen Artikel hinzufügen';
            } else {
                text.appendChild(hervorheben(t.name, q));
            }
            zeile.appendChild(text);
            if (!t.frei && (aufListe(t.key) || zuletzt(t.key))) {
                var h = document.createElement('div');
                h.className = 'hinweis';
                h.textContent = aufListe(t.key) ? 'auf der Liste' : 'zuletzt';
                zeile.appendChild(h);
            }
            zeile.onmousedown = function (e) {
                e.preventDefault();
                waehlen(i);
            };
            box.appendChild(zeile);
        });
        box.classList.toggle('offen', treffer.length > 0);
    }

    function schliessenVorschlaege() {
        document.getElementById('vorschlaege').classList.remove('offen');
    }

    function tasten(e) {
        var offen = document.getElementById('vorschlaege').classList.contains('offen');
        if (!offen || !treffer.length) return;
        if (e.key === 'ArrowDown') {
            auswahl = (auswahl + 1) % treffer.length;
        } else if (e.key === 'ArrowUp') {
            auswahl = (auswahl - 1 + treffer.length) % treffer.length;
        } else if (e.key === 'Escape') {
            schliessenVorschlaege();
            return;
        } else if (e.key === 'Enter' && auswahl >= 0) {
            e.preventDefault();
            waehlen(auswahl);
            return;
        } else {
            return;
        }
        e.preventDefault();
        zeichnenVorschlaege(eingabeTeile().name.toLowerCase());
    }

    function waehlen(i) {
        var t = treffer[i];
        if (!t) return;
        var spec = eingabeTeile().spec;
        var feld = document.getElementById('neu');
        if (t.frei) {
            senden({ aktion: 'hinzufuegen', text: t.name + (spec ? ', ' + spec : '') });
            meldung('„' + t.name + '“ wird hinzugefügt …');
        } else if (aufListe(t.key) && !spec) {
            meldung('„' + t.name + '“ steht schon auf der Liste.');
        } else {
            senden({ aktion: 'artikel', key: t.key, spec: spec });
            var i2 = eink.recently.findIndex(function (a) { return a.key === t.key; });
            if (i2 >= 0) eink.recently.splice(i2, 1);
            if (!aufListe(t.key)) {
                eink.purchase.push({ key: t.key, name: t.name, spec: spec, icon: t.icon, buchstabe: t.buchstabe });
            }
            zeichnen();
            meldung('„' + t.name + '“ hinzugefügt.');
        }
        feld.value = '';
        treffer = [];
        schliessenVorschlaege();
        feld.focus();
    }

    function hinzufuegen(e) {
        e.preventDefault();
        var feld = document.getElementById('neu');
        var text = feld.value.trim();
        if (!text) return;
        senden({ aktion: 'hinzufuegen', text: text });
        feld.value = '';
        schliessenVorschlaege();
        meldung('Wird hinzugefügt …');
    }

    function benachrichtigen(typ, text) {
        senden({ aktion: 'benachrichtigen', typ: typ });
        meldung('„' + text + '“ wird gesendet …');
    }

    function oeffnen(artikel, bereich) {
        einkAktuell = artikel;
        document.getElementById('dialogTitel').textContent = artikel.name;
        document.getElementById('dialogSpec').value = artikel.spec || '';
        document.getElementById('dialog').classList.add('offen');
    }

    function schliessen() {
        document.getElementById('dialog').classList.remove('offen');
        einkAktuell = null;
    }

    function speichern() {
        if (!einkAktuell) return;
        senden({ aktion: 'beschreibung', key: einkAktuell.key, spec: document.getElementById('dialogSpec').value });
        schliessen();
    }

    function entfernen() {
        if (!einkAktuell) return;
        senden({ aktion: 'entfernen', key: einkAktuell.key });
        schliessen();
    }
</script>
